<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>希的私人拆信室｜Boget 生日郵局</title>
<style>
:root{--blue:#91a9b8;--deep:#486777;--cream:#faf6ef;--ink:#405660;--line:#d4e0e4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#f8f4eb,#e5eef1);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif}main{max-width:850px;margin:auto;padding:48px 18px 90px}.hero{text-align:center;padding:36px 20px;background:#ffffffb5;border:1px solid white;border-radius:30px;box-shadow:0 15px 45px #6e8d9d1c}.eyebrow{letter-spacing:.18em;font-size:12px;color:#708c9c}.dog{font-size:60px;margin:14px 0}.hero h1{font-family:serif;font-size:clamp(29px,5vw,43px);font-weight:500;margin:10px 0}.hero p{color:#71868e;line-height:1.9}.panel{margin-top:24px;background:#fffaf5e8;border:1px solid white;border-radius:25px;padding:26px}.panel h2{font-size:21px;font-weight:500;margin:0 0 18px}.field{display:block;margin:16px 0 8px;font-size:14px}input{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;font:inherit;color:var(--ink);background:white}button{font:inherit;border:0;border-radius:25px;padding:12px 19px;cursor:pointer;background:var(--deep);color:white}button:hover{background:#365564}button:disabled{opacity:.55;cursor:wait}.primary{width:100%;margin-top:20px}.outline{background:#e6eef0;color:var(--deep)}.outline:hover{background:#d9e7eb}.muted{font-size:13px;color:#71868e;line-height:1.8}.status{min-height:24px;margin-top:12px;font-size:14px;color:#486777}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 24px}.stat{padding:12px 16px;background:#e9f0f2;border-radius:16px;font-size:14px}.stat strong{font-size:19px;color:var(--deep)}.letters{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}.letter{background:white;border:1px solid #e2eaec;border-radius:20px;padding:20px;box-shadow:0 5px 16px #6e8d9d0e}.letter .emoji{font-size:32px}.letter h3{font-size:17px;font-weight:600;margin:12px 0 5px;overflow-wrap:anywhere}.letter time{font-size:12px;color:#83959a}.letter .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.letter .actions button{font-size:13px;padding:10px 13px}.message{margin-top:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;background:#f8f5ef;border-radius:14px;padding:15px;font-size:15px}.hidden{display:none!important}.empty{text-align:center;padding:28px;color:#71868e;line-height:1.9}.footer{text-align:center;margin-top:28px;font-size:12px;color:#83959a}@media(max-width:500px){main{padding-top:22px}.panel{padding:20px}.toolbar{align-items:flex-start}}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">BOGET'S SECRET BIRTHDAY MAILBOX</div><div class="dog" aria-hidden="true">🐶💌</div><h1>希的私人拆信室</h1><p>31 歲的溫柔祝福，都由 Boget 好好收藏。<br>只有希可以親自拆開每一封信。🩵</p></header>
<section class="panel" id="loginPanel"><h2>🔐 希的專屬登入</h2><p class="muted">請使用妳在 Supabase 建立的帳號密碼。不要把密碼提供給任何人。</p><form id="loginForm"><label class="field" for="email">登入 Email</label><input id="email" type="email" autocomplete="username" required placeholder="妳的登入 Email"><label class="field" for="password">密碼</label><input id="password" type="password" autocomplete="current-password" required placeholder="妳的登入密碼"><button class="primary" id="loginButton" type="submit">🐾 進入我的秘密信箱</button></form><div class="status" id="loginStatus" role="status"></div></section>
<section class="panel hidden" id="mailPanel"><div class="toolbar"><h2>✉️ Boget 收到的祝福</h2><div><button class="outline" id="refreshButton" type="button">重新整理</button> <button class="outline" id="logoutButton" type="button">登出</button></div></div><div class="stats"><div class="stat">總共 <strong id="totalCount">0</strong> 封</div><div class="stat">還沒拆 <strong id="unreadCount">0</strong> 封</div><div class="stat">已收藏 <strong id="favoriteCount">0</strong> 封</div></div><div class="status" id="mailStatus" role="status"></div><div class="letters" id="lettersList"></div></section>
<div class="footer">Made with love · XI's 31st Birthday · 2026</div>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://moqhjmuejxdurtfjgmbs.supabase.co','sb_publishable_StRv8quUrOwk039r2RHUHw_bDOfdSqP',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
const loginPanel=$('loginPanel'),mailPanel=$('mailPanel'),loginStatus=$('loginStatus'),mailStatus=$('mailStatus'),lettersList=$('lettersList');
let letters=[];let currentUserId=null;
function setLoggedIn(loggedIn){loginPanel.classList.toggle('hidden',loggedIn);mailPanel.classList.toggle('hidden',!loggedIn);if(!loggedIn){letters=[];lettersList.replaceChildren();currentUserId=null;}}
function friendlyError(error){if(error?.message?.includes('Invalid login credentials'))return '登入資料不正確，請確認 Email 與密碼。';return '操作暫時失敗，請稍後再試。';}
function button(label,cls,handler){const el=document.createElement('button');el.type='button';el.className=cls;el.textContent=label;el.addEventListener('click',handler);return el;}
function render(){const total=letters.length,unread=letters.filter(x=>!x.is_opened).length,fav=letters.filter(x=>x.is_favorite).length;$('totalCount').textContent=total;$('unreadCount').textContent=unread;$('favoriteCount').textContent=fav;lettersList.replaceChildren();if(!total){const empty=document.createElement('div');empty.className='empty';empty.textContent='🐶 Boget 正在等第一封祝福來敲門…';lettersList.append(empty);return;}
 for(const letter of letters){const article=document.createElement('article');article.className='letter';const emoji=document.createElement('div');emoji.className='emoji';emoji.textContent=letter.is_opened?'💌':'✉️';const name=document.createElement('h3');name.textContent=letter.sender_name||'匿名';const time=document.createElement('time');const date=new Date(letter.created_at);time.textContent=Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(date);const actions=document.createElement('div');actions.className='actions';const message=document.createElement('div');message.className='message hidden';message.textContent=letter.message||'';const open=button(letter.is_opened?'再讀一次':'🐾 拆開信封','',async()=>{const wasHidden=message.classList.contains('hidden');message.classList.toggle('hidden');open.textContent=message.classList.contains('hidden')?'查看祝福':'收起祝福';if(wasHidden&&!letter.is_opened){const {error}=await supabase.from('birthday_letters').update({is_opened:true}).eq('id',letter.id);if(error){mailStatus.textContent='拆信紀錄更新失敗，請稍後重新整理。';return;}letter.is_opened=true;emoji.textContent='💌';renderCounts();}});const favorite=button(letter.is_favorite?'⭐ 已收藏':'☆ 收藏','outline',async()=>{favorite.disabled=true;const next=!letter.is_favorite;const {error}=await supabase.from('birthday_letters').update({is_favorite:next}).eq('id',letter.id);favorite.disabled=false;if(error){mailStatus.textContent='收藏狀態更新失敗，請稍後再試。';return;}letter.is_favorite=next;favorite.textContent=next?'⭐ 已收藏':'☆ 收藏';renderCounts();});actions.append(open,favorite);article.append(emoji,name,time,actions,message);lettersList.append(article);}}
function renderCounts(){$('totalCount').textContent=letters.length;$('unreadCount').textContent=letters.filter(x=>!x.is_opened).length;$('favoriteCount').textContent=letters.filter(x=>x.is_favorite).length;}
async function loadLetters(){mailStatus.textContent='🐶 Boget 正在整理信件…';const {data,error}=await supabase.from('birthday_letters').select('id,sender_name,message,created_at,is_opened,is_favorite').order('created_at',{ascending:false});if(error){mailStatus.textContent='讀取信件失敗，請確認登入權限後重試。';return;}letters=data||[];render();mailStatus.textContent='信件已更新 🩵';}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginButton');btn.disabled=true;loginStatus.textContent='正在確認希的身分…';const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';btn.disabled=false;if(error){loginStatus.textContent=friendlyError(error);return;}if(data.user){currentUserId=data.user.id;setLoggedIn(true);await loadLetters();}});
$('refreshButton').addEventListener('click',loadLetters);
$('logoutButton').addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error){mailStatus.textContent='登出失敗，請重試。';return;}setLoggedIn(false);loginStatus.textContent='已安全登出。';});
supabase.auth.onAuthStateChange((_event,session)=>{if(!session?.user){setLoggedIn(false);}else if(currentUserId!==session.user.id){currentUserId=session.user.id;setLoggedIn(true);setTimeout(loadLetters,0);}});
const {data:{session},error}=await supabase.auth.getSession();if(error){loginStatus.textContent='登入狀態確認失敗，請重新登入。';}else if(session?.user){currentUserId=session.user.id;setLoggedIn(true);await loadLetters();}else{setLoggedIn(false);}
</script>
</body></html>
