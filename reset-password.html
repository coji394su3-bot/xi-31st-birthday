<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>重設密碼｜希的私人拆信室</title>
<style>
:root{--deep:#486777;--ink:#405660}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#f8f4eb,#e5eef1);font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}main{width:min(100%,480px);background:#fffaf5e8;border:1px solid white;border-radius:28px;padding:36px 28px;box-shadow:0 15px 45px #6e8d9d1c}h1{text-align:center;font-size:27px;font-weight:500}p{line-height:1.8;color:#71848b;text-align:center}label{display:block;margin:20px 0 8px}input{width:100%;border:1px solid #cbd9de;border-radius:14px;padding:15px;font:inherit}button{width:100%;margin-top:24px;border:0;border-radius:30px;padding:15px;background:var(--deep);color:white;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#status{min-height:24px;margin-top:18px;font-size:14px;text-align:center}a{color:var(--deep)}.back{text-align:center;margin-top:20px;font-size:14px}
</style>
</head>
<body><main>
<h1>🐶🔐 Boget 的密碼重設室</h1>
<p>這裡只用來替希的私人拆信室設定新密碼。</p>
<form id="resetForm" hidden>
<label for="password">新密碼（至少 8 個字元）</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">再輸入一次新密碼</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button id="submit" type="submit">儲存新密碼 💌</button>
</form>
<div id="status" role="status">正在確認重設連結…</div>
<div class="back"><a href="/letters.html">返回私人拆信室</a></div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://moqhjmuejxdurtfjgmbs.supabase.co',
  'sb_publishable_StRv8quUrOwk039r2RHUHw_bDOfdSqP',
  {
    auth: {
      detectSessionInUrl: false,
      persistSession: false,
      autoRefreshToken: false
    }
  }
);

const form = document.getElementById('resetForm');
const status = document.getElementById('status');
const button = document.getElementById('submit');
let recoveryVerified = false;

function ready() {
  recoveryVerified = true;
  form.hidden = false;
  status.textContent = '連結驗證成功，請設定新密碼。';
}

function fail(message) {
  recoveryVerified = false;
  form.hidden = true;
  status.textContent = message;
}

async function initialize() {
  const url = new URL(window.location.href);
  const hash = new URLSearchParams(url.hash.slice(1));

  if (hash.has('error') || url.searchParams.has('error')) {
    fail('重設連結失效或已過期，請重新申請。');
    return;
  }

  const tokenHash = url.searchParams.get('token_hash');
  const code = url.searchParams.get('code');
  const accessToken = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');
  const type = url.searchParams.get('type') || hash.get('type');

  if (!(
    (tokenHash && type === 'recovery') ||
    code ||
    (accessToken && refreshToken && type === 'recovery')
  )) {
    fail('請從最新的密碼重設信開啟此頁面。');
    return;
  }

  try {
    let result;

    if (tokenHash && type === 'recovery') {
      result = await supabase.auth.verifyOtp({
        token_hash: tokenHash,
        type: 'recovery'
      });
    } else if (code) {
      result = await supabase.auth.exchangeCodeForSession(code);
    } else {
      result = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
    }

    if (result.error) throw result.error;

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session?.user) {
      throw new Error('無法確認登入狀態');
    }

    history.replaceState(null, '', url.pathname);
    ready();
  } catch {
    history.replaceState(null, '', url.pathname);
    fail('無法驗證重設連結，請重新申請最新的密碼重設信。');
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!recoveryVerified) return;

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8) {
    status.textContent = '新密碼至少需要 8 個字元。';
    return;
  }

  if (password !== confirm) {
    status.textContent = '兩次輸入的密碼不一致。';
    return;
  }

  button.disabled = true;
  status.textContent = '正在儲存新密碼…';

  try {
    const { error } = await supabase.auth.updateUser({ password });
    if (error) throw error;

    await supabase.auth.signOut();
    recoveryVerified = false;
    form.hidden = true;
    status.textContent = '✅ 新密碼設定完成！請返回私人拆信室登入。';
  } catch {
    status.textContent = '儲存失敗，請確認新密碼符合要求後再試。';
    button.disabled = false;
  }
});

initialize();
</script>

</body></html>
